name = "spark_worker"
description = "Fast agent for small, reversible, mechanical code edits."
# Was "gpt-5.3-codex-spark". Repointed to Luna on 2026-08-27 for two reasons:
#   1. Project policy is Luna and Terra only.
#   2. gpt-5.3-codex-spark is a text-only research preview limited to ChatGPT
#      Pro accounts, so it is not a dependable orchestration target.
# Luna at low effort is the documented fit for this role: "specific,
# high-volume tasks when you know what a good result looks like."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Handle only small and reversible tasks.
Do not handle auth, billing, secrets, migrations, or production systems.
Change only the assigned files.
Do not dispatch subagents.
Do not commit.
Run focused checks and return the changed paths.
"""
