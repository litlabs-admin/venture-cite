name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint • typecheck • test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history. The Supabase mirror check below regenerates its
          # baseline from `git show 45d3d8f7…:shared/schema.ts`, and the default
          # fetch-depth of 1 does not carry that commit's tree, so the step died
          # with "path 'shared/schema.ts' exists on disk, but not in
          # 45d3d8f7…". It passed locally only because a normal clone has the
          # history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Type check
        run: npm run check

      # Guards the generated Supabase mirror against `migrations/`.
      #
      # This was never wired up, and the mirror silently drifted nine files out of
      # date: `migrations/` held 124 files while `supabase/migrations/` held 116,
      # missing 0094-0100 and 0115-0116. Every `supabase start`, `supabase db reset`
      # and preview branch therefore built an incomplete schema - 62 of 74 tables -
      # with no signal that anything was wrong.
      #
      # The check also enforces that generated Supabase versions are unique, which
      # matters because root migration numbers are not: 0094-0100 each carry two
      # files. The application runner keys on filename and is unaffected; Supabase
      # keys on version and cannot apply colliding ones.
      - name: Supabase migration mirror
        run: npm run supabase:migrations:check

      # Regenerates `.claude/skills/` from `.agents/project-skills.json` and fails
      # when the list names a skill that was never vendored into `.agents/skills/`.
      # Without this, a missing skill only shows up as a silently absent capability
      # in someone's editor session.
      - name: Project skills
        run: npm run skills:setup

      # `shared/schema.ts` is being split into domain modules behind a barrel
      # (B4). 147 files import it and 25 use `import * as schema`, so a dropped
      # or renamed export breaks callers at runtime while the compiler stays
      # quiet about names nothing currently references. The baseline is the
      # surface as it stood before the split began.
      - name: Schema export surface
        run: npm run schema:surface:check

      # `server/databaseStorage.ts` is being split into domain storage modules
      # behind a composed `storage` object (B5). This walks the TypeScript AST
      # to prove three things `tsc` cannot: `IStorage` declares no fewer
      # methods than origin/main, no method is implemented in two files (object
      # spread would resolve that silently, last writer wins), and no method
      # body differs from origin/main's for a method that also moved files
      # (a pure move must not change behaviour).
      #
      # The baseline is origin/main itself, not a JSON file checked into this
      # branch - a baseline a PR can rewrite is not a ratchet. The original B5
      # baseline (.audit/B5/storage-surface-before.json) proved this the hard
      # way: it was generated by the same commit that finished most of the
      # decomposition, so it could not have caught a method lost during that
      # work. This check only catches drift relative to whatever is already
      # merged; it cannot catch a regression a PR introduces and "fixes" back
      # within the same branch before merging, and it says nothing about
      # correctness beyond interface shape, method uniqueness, and unmoved-body
      # equality - it does not run the code. The body-equality rule only makes
      # sense while the decomposition is in flight: once it merges to main,
      # this step (or at least that rule) should be retired, or every future
      # bugfix to a storage method's body will fail it with no PR-local way to
      # update the baseline.
      - name: Storage surface
        run: npm run storage:surface:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  # Integration tests need a real database. They were previously invisible: the
  # `check` job runs `npm test` with no DATABASE_URL, so every test behind
  # `configureDestructiveDatabaseTest` returned `{ kind: "skip" }` and the suite
  # reported green while 16 files never ran. That covered the RLS policy tests,
  # the migration application tests and the outbox idempotency tests.
  integration:
    name: integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      # The CLI is pinned in devDependencies, so `npx` uses that version rather
      # than whatever the runner image ships.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      # `supabase start` reuses an existing volume and skips migrations when one
      # is present. A CI runner is always fresh, but this check is cheap and it
      # turns a silent gap in the migration ledger into a clear failure. It caught
      # exactly that locally on 2026-08-28, where 5 of 130 migrations were missing.
      # It also runs a few cheap structural checks (role/RLS/grant existence) for
      # the most recent migrations, which catch drift a complete ledger can miss
      # (2026-08-31: ledger complete, role grants absent) — those checks cover
      # only the objects they name, not the whole schema.
      - name: Assert every migration applied
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
        run: npm run db:assert-migrations

      # Two constraints, both verified locally on 2026-08-28.
      #
      # `--no-file-parallelism`: all 19 files share one database and do not
      # isolate their fixtures. Running them in parallel produced 5 failures that
      # moved between files on each run; single-threaded produced 0.
      #
      # `OPENAI_API_KEY`: `server/lib/routesShared.ts:26` constructs the OpenAI
      # client at module load, so importing `server/routes/factSheetV2.ts` throws
      # without a key even in tests that mock the client. The value is never used
      # for a request. Making that client lazy would remove the need for it.
      - name: Integration tests
        env:
          LOCAL_SUPABASE_TEST: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: npx vitest run --no-file-parallelism tests/integration tests/migrations tests/unit/factScrapeCacheStorage.test.ts tests/unit/v2LifecycleStorage.test.ts

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
