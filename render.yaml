# Render Blueprint — free-tier web service.
#
# Derived from the actual repo state (not assumption):
#   - `npm run build` = `db:migrate && vite build` (package.json). The old
#     esbuild step that bundled server/vercelEntry.ts into api/_bundle.js is
#     gone, along with that entry file and the api/ directory — verified
#     absent 2026-07-31. Nothing Vercel-specific runs in this build any more.
#   - `vite build` runs the `nitro` Vite plugin (vite.config.ts). With no
#     VERCEL env var present, Nitro auto-detects the `node-server` preset and
#     (because vite.config.ts pins `output.dir` for non-Vercel builds) writes
#     dist/{nitro.json,public,server}. Proven with a real `node-server` build
#     this session: dist/server/index.mjs reads
#     `process.env.NITRO_PORT ?? process.env.PORT` and binds all interfaces
#     when NITRO_HOST/HOST are unset (srvx default) — Render-compatible.
#   - `npm start` = `cross-env NODE_ENV=production node --env-file-if-exists=.env
#     dist/server/index.mjs` — already points at Nitro's generated entry, not
#     the old esbuild bundle.
#   - `/health` (server/app.ts) does a real `SELECT 1` against the DB and
#     returns 503 if it fails — a real health check, not a static 200.
#   - `server/nitroBoot.ts` (registered via vite.config.ts's
#     `nitro({ plugins: [...] })`) runs DB migrations, the in-process node-cron
#     scheduler, autopilot resume, and Stripe product setup exactly once per
#     process — but ONLY when NODE_ENV=production and VERCEL is unset. Render
#     must set NODE_ENV=production explicitly (below) or every one of those
#     boot side-effects silently no-ops.
#
# FREE TIER — read before deploying:
#   - The free web service plan spins DOWN after ~15 minutes of no inbound
#     HTTP traffic and cold-starts (10s+) on the next request. This blueprint
#     does not fight that; the user has confirmed a plan for an external
#     uptime/scheduler ping.
#   - Free-tier Render does NOT support Cron Job resources (a paid feature)
#     — there is deliberately no `- type: cron` service below. Do not add one
#     on this plan; it will fail to deploy or silently require an upgrade.
#     Scheduled work (weekly reports, purges, citation scans, etc.) on Render
#     currently relies on nitroBoot's in-process node-cron scheduler
#     (server/scheduler.ts), which only runs at all because this is a
#     long-lived process — that scheduler has NOTHING to do with Render's
#     paid Cron Job product. If the user's external scheduler is ALSO going
#     to hit POST /api/cron/daily-orchestrator on this Render service, that
#     would run the same job set twice (in-process scheduler + externally
#     triggered orchestrator) — see docs/deploy-runbook.md, flagged there as
#     a decision the user needs to make, not resolved here.
#
# NOTE ON REDDIT: there are no REDDIT_* variables to set. The mention
# scanner reads Reddit unauthenticated only (public JSON + RSS); the OAuth
# path and its four credential vars were removed. Reddit currently 403s that
# unauthenticated traffic, so the Mentions feature returns Hacker News
# results only and records Reddit as a failed source.
#
# Secrets are intentionally left unset (`sync: false`) — set real values in
# the Render dashboard. No secret values are ever written to this file.
# See docs/deploy-runbook.md for the full env var reference (required vs
# optional, build-time vs runtime, host-specific).

services:
  - type: web
    name: venturecite
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # ── Required: NODE_ENV gates nitroBoot's side-effects (migrations,
      # scheduler, autopilot resume, Stripe setup). Without this exact
      # value, Render would boot a working HTTP server that silently never
      # runs a migration or a scheduled job. ──
      - key: NODE_ENV
        value: production
      # ── Single owner of scheduled work. ──
      # Six jobs are registered BOTH in the in-process node-cron scheduler
      # and in POST /api/cron/daily-orchestrator: account-purge,
      # auto-citation, brand-purge, listicle-scan, mention-scan and
      # weekly-report. With both live they each run twice — duplicate weekly
      # report EMAILS to real users, and duplicate LLM spend on citation and
      # mention scans. The advisory locks do not prevent this: they stop two
      # runners overlapping, not one firing 15 minutes after the other.
      #
      # On this free plan the in-process scheduler is not viable regardless —
      # the service sleeps after ~15 minutes idle and node-cron dies with it.
      # So the external scheduler owns scheduling, and this flag switches the
      # in-process one off. If you ever move to a paid always-on plan and
      # drop the external scheduler, set this to false instead.
      #
      # ── CALL THE ORCHESTRATOR HOURLY, NOT DAILY. ──
      # Not a preference — daily silently loses work, for two reasons:
      #
      # 1. BUDGET. The orchestrator's wall-clock budget is CRON_TOTAL_BUDGET_MS,
      #    derived from VERCEL_FUNCTION_BUDGET_MS (unset here => 60s default,
      #    so 57s). The per-step caps in STEP_CAPS_MS sum to ~411s, and
      #    v2-monthly-fact-refresh alone may take 50s of the 57. On a busy tick
      #    the later steps are SKIPPED — reported in `skippedDueToBudget`, but
      #    the response still says success:true. Most steps roll forward via
      #    their own lastXxxAt timestamps, so the next tick picks them up.
      #    Hourly means "next tick" is an hour away rather than a day.
      #
      # 2. DAY-GATED WORK. mention-scan, listicle-scan and competitor-discovery
      #    run only when isMonday; weekly-report-legacy only when isSunday. A
      #    single daily call gives each ONE attempt per week — if that attempt
      #    is starved by budget, the job waits a full week. Hourly gives 24
      #    attempts on the correct day, and server/lib/jobDebounce.ts (20h
      #    window on both) guarantees only the first one does the work.
      #
      # Hourly also restores auto-citation's real cadence: the in-process
      # scheduler ran it at "0 * * * *", and the orchestrator is now its only
      # trigger. Its debounce window is 45min, deliberately under the hour.
      - key: DISABLE_IN_PROCESS_SCHEDULER
        value: "true"
      # Pin to the version verified with real builds this session
      # (`node -v` => v24.11.1). No .nvmrc/engines field exists in the repo
      # today (confirmed) so Render would otherwise pick its own default.
      - key: NODE_VERSION
        value: 24.11.1
      # PORT is auto-injected by Render — do not set it here. Nitro's
      # node-server entry reads process.env.PORT directly (verified: real
      # dist/server/index.mjs contains
      # `process.env.NITRO_PORT ?? process.env.PORT`).

      # ── Required at boot — server/env.ts throws and the process refuses
      # to start if any of these are missing/invalid. ──
      # No RENDER_EXTERNAL_URL fallback exists in server/env.ts (only
      # VERCEL_URL is auto-detected) — APP_URL MUST be set explicitly here,
      # unlike on Vercel where it can be left unset.
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── Strongly recommended — app boots without these, but core
      # features fail closed or degrade. ──
      # Powers Claude/Gemini/Perplexity/DeepSeek citation checks + the
      # chatbot endpoint (which throws a clear runtime error if unset).
      - key: OPENROUTER_API_KEY
        sync: false
      # Build-time (Vite bakes these into the client bundle during
      # `vite build`, part of this service's own buildCommand) — without
      # them the client can't reach Supabase auth or Stripe Checkout at all.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      # Authenticates POST /api/cron/daily-orchestrator (Bearer or
      # x-cron-secret header). Required for the user's planned external
      # scheduler to be able to call it on this host — server/routes/cron.ts
      # fails closed (returns unauthorized) with no secret set.
      - key: CRON_SECRET
        sync: false
      # Resend: weekly AI-visibility report emails + bounce/complaint
      # webhook verification. RESEND_WEBHOOK_SECRET fails closed (rejects
      # all webhook requests) when unset — set it if the Resend webhook is
      # configured to point at this host.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # AES-256-GCM key for encrypting user-supplied Buffer API tokens at
      # rest. Only loaded lazily by the Buffer feature, but generate with
      # `openssl rand -base64 32` and set it before any user connects Buffer.
      - key: BUFFER_ENCRYPTION_KEY
        sync: false
      # Signs one-click email-unsubscribe tokens. Falls back to
      # SESSION_SECRET if unset — set at least one of the two.
      - key: EMAIL_UNSUBSCRIBE_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false

    # Everything else (SENTRY_DSN, LOG_LEVEL, DATABASE_CA_CERT_PATH,
    # the *_CRON schedule
    # overrides consumed by server/scheduler.ts, JINA_API_KEY,
    # FACT_AGENT_*_ENABLED, WEEKLY_MAX_BRANDS_PER_USER, etc.) is optional —
    # see docs/deploy-runbook.md for the complete table. Add them in the
    # Render dashboard as needed; nothing above is exhaustive by design.
